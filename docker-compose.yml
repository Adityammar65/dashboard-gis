services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-gis-app
    ports:
      - "${APP_PORT:-8090}:8000"
    environment:
      APP_NAME: GIS-Dashboard
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8090
      APP_KEY: "${DOCKER_APP_KEY:-}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: gis_database
      DB_USERNAME: laravel
      DB_PASSWORD: "${MYSQL_APP_PASSWORD:-laravel}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      IMAGE_DISK: "${IMAGE_DISK:-public}"
      IMAGE_MAX_LONGEST_SIDE: "${IMAGE_MAX_LONGEST_SIDE:-1600}"
      IMAGE_WEBP_QUALITY: "${IMAGE_WEBP_QUALITY:-85}"
      IMAGE_SHARP_YUV: "${IMAGE_SHARP_YUV:-true}"
      IMAGE_METHOD: "${IMAGE_METHOD:-4}"
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-bootstrap:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: dashboard-gis-mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-gis_database}"
      MYSQL_USER: "laravel"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:-laravel}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: dashboard-gis-phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT:-8091}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_ABSOLUTE_URI: "http://localhost:${PHPMYADMIN_PORT:-8091}/"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-storage:
  app-bootstrap:
  mysql-data:
