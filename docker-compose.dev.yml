services:
  reset-and-seed:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["dev-seeder"]
    environment:
      APP_NAME: GIS-Dashboard
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${DOCKER_APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: gis_database
      DB_USERNAME: laravel
      DB_PASSWORD: "${MYSQL_APP_PASSWORD:-laravel}"
    entrypoint: ["/bin/sh", "-lc"]
    command: ["php artisan migrate:fresh --seed --force"]
    depends_on:
      mysql:
        condition: service_healthy
